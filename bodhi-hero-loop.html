<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bodhi — Appraiseye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #07021a;
    --bg-mid: #150535;
    --purple-1: #8B5CF6;
    --purple-2: #A855F7;
    --purple-3: #C084FC;
    --purple-glow: #6D28D9;
    --pink-accent: #EC4899;
    --green-cell: #4ADE80;
    --green-mask: #84CC16;
    --amber: #F59E0B;
    --steel-1: #4B5563;
    --steel-2: #9CA3AF;
    --steel-3: #D1D5DB;
    --text-primary: #F9FAFB;
    --text-dim: rgba(249, 250, 251, 0.55);
    --text-mute: rgba(249, 250, 251, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100%;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    background:
      radial-gradient(ellipse 60% 80% at 80% 30%, rgba(139, 92, 246, 0.18), transparent 60%),
      radial-gradient(ellipse 50% 70% at 20% 80%, rgba(168, 85, 247, 0.12), transparent 60%),
      linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    overflow: hidden;
  }

  /* Subtle grain texture */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.06;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  .scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg.bodhi-svg {
    width: 100%;
    height: 100%;
    max-width: 1600px;
  }

  /* ---------- TIMING ----------
     Total loop: 14s
     Beat 1 (Wide): 0  - 3.5s
     Beat 2 (Push in / cell zoom): 3.5 - 6.5s
     Beat 3 (AI vision overlay): 6.5 - 10s
     Beat 4 (Fault isolation + pull-back): 10 - 14s
  --------------------------------- */

  /* Camera scenes - shown/hidden via opacity */
  .scene-wide      { animation: showWide 14s infinite ease-in-out; }
  .scene-zoom      { animation: showZoom 14s infinite ease-in-out; }
  .scene-vision    { animation: showVision 14s infinite ease-in-out; }
  .scene-isolation { animation: showIsolation 14s infinite ease-in-out; }

  @keyframes showWide {
    0%, 22% { opacity: 1; }
    25%, 95% { opacity: 0; }
    98%, 100% { opacity: 1; }
  }
  @keyframes showZoom {
    0%, 22% { opacity: 0; }
    25%, 42% { opacity: 1; }
    45%, 100% { opacity: 0; }
  }
  @keyframes showVision {
    0%, 42% { opacity: 0; }
    47%, 68% { opacity: 1; }
    72%, 100% { opacity: 0; }
  }
  @keyframes showIsolation {
    0%, 68% { opacity: 0; }
    72%, 92% { opacity: 1; }
    95%, 100% { opacity: 0; }
  }

  /* Roller bottles spin around their LONG axis (rotisserie style), not end-over-end.
     In 2D we convey this by sliding the highlight stripe along the bottle surface,
     not by rotating the bottle itself. The .roller class is now a no-op visually;
     the .roll-stripe inside the bottle symbol does the work. */
  .roller {
    /* bottle stays fixed horizontally — no transform */
  }
  .roll-stripe-light {
    animation: stripeSlide 2.4s linear infinite;
  }
  .roll-stripe-dark {
    animation: stripeSlide 2.4s linear infinite;
    animation-delay: -1.2s;
  }
  @keyframes stripeSlide {
    /* The stripe is 156px wide and the bottle interior is 156px wide.
       Slide vertically across the bottle's diameter (44px) to look like
       the surface is rotating toward us. */
    0%   { transform: translateY(-22px); opacity: 0; }
    15%  { opacity: 0.6; }
    50%  { transform: translateY(0px);   opacity: 0.8; }
    85%  { opacity: 0.6; }
    100% { transform: translateY(22px);  opacity: 0; }
  }

  /* The crescent (cells + media settled by gravity) is STATIC at the bottom.
     This is biologically correct — adherent cells follow the bottle wall during
     rotation, and the media level is always at the lowest point.
     The "rolling" cue comes from the .rim-highlight that orbits around. */
  .crescent {
    /* no animation — settled state is static */
  }

  /* Rim highlight: a small bright spot on the porthole inner wall that orbits
     around once per 6 seconds, suggesting the bottle's internal surface is rotating.
     This is the visual proof of motion without faking the cells. */
  .rim-highlight {
    transform-origin: 0 0;
    animation: rimOrbit 6s linear infinite;
  }
  @keyframes rimOrbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Status LEDs breathing */
  .led {
    animation: breathe 2s ease-in-out infinite;
  }
  .led-2 { animation-delay: 0.3s; }
  .led-3 { animation-delay: 0.6s; }
  @keyframes breathe {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Bottle 7 soft fault halo — fades in during the isolation beat.
     Applied to a radial-gradient ellipse (fill stays constant, only opacity changes). */
  .bottle-fault {
    opacity: 0;
    animation: faultHalo 14s infinite;
  }
  @keyframes faultHalo {
    0%, 70% { opacity: 0; }
    74%, 90% { opacity: 1; }
    93%, 100% { opacity: 0; }
  }

  /* Amber status strip under bottle 7 */
  .bottle-fault-strip {
    opacity: 0;
    animation: faultStrip 14s infinite;
  }
  @keyframes faultStrip {
    0%, 70% { opacity: 0; }
    74%, 90% { opacity: 0.85; }
    93%, 100% { opacity: 0; }
  }

  .other-bottle-glow {
    animation: greenGlow 14s infinite;
  }
  @keyframes greenGlow {
    0%, 70% { opacity: 0; }
    74%, 90% { opacity: 0.6; }
    93%, 100% { opacity: 0; }
  }

  /* AI vision segmentation mask reveal */
  .seg-mask {
    animation: segReveal 14s infinite;
  }
  @keyframes segReveal {
    0%, 50% { opacity: 0; }
    55%, 65% { opacity: 0.85; }
    68%, 100% { opacity: 0; }
  }

  /* Scanning line */
  .scan-line {
    animation: scan 14s infinite;
  }
  @keyframes scan {
    0%, 47% { transform: translateY(0); opacity: 0; }
    48% { opacity: 0.9; }
    62% { transform: translateY(220px); opacity: 0.9; }
    65%, 100% { opacity: 0; transform: translateY(0); }
  }

  /* Cell growth pulse */
  .cell {
    animation: cellPulse 4s ease-in-out infinite;
  }
  .cell:nth-child(2n) { animation-delay: 0.5s; }
  .cell:nth-child(3n) { animation-delay: 1.1s; }
  .cell:nth-child(5n) { animation-delay: 1.7s; }
  @keyframes cellPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  /* HUD readouts */
  .hud-text {
    font-family: 'JetBrains Mono', monospace;
    fill: var(--text-primary);
  }
  .hud-label {
    font-family: 'Inter', sans-serif;
    fill: var(--text-dim);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .hud-value {
    font-family: 'JetBrains Mono', monospace;
    fill: var(--purple-3);
    font-weight: 500;
  }

  /* Brand mark */
  .brand-mark {
    position: absolute;
    top: 36px;
    left: 40px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--purple-3), var(--purple-glow));
    box-shadow: 0 0 18px rgba(168, 85, 247, 0.6);
    position: relative;
  }
  .brand-dot::after {
    content: '';
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    background: var(--bg-deep);
  }
  .brand-text {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 18px;
    letter-spacing: 0.02em;
  }
  .brand-text b {
    color: var(--purple-2);
    font-weight: 600;
  }

  /* Tagline bottom-right */
  .tagline {
    position: absolute;
    bottom: 36px;
    right: 40px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-mute);
    z-index: 10;
  }

  /* Caption that changes per beat */
  /* Caption that changes per beat. */
  .caption {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    width: 90%;
    max-width: 600px;
  }

  .caption-line {
    display: block;
    font-family: 'Instrument Serif', serif;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    opacity: 0;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    bottom: 0;
  }
  .caption-line em {
    font-style: italic;
    color: var(--purple-3);
  }

  .caption-1 { animation: cap1 14s infinite; }
  .caption-2 { animation: cap2 14s infinite; }
  .caption-3 { animation: cap3 14s infinite; }
  .caption-4 { animation: cap4 14s infinite; }

  @keyframes cap1 {
    0%, 3% { opacity: 0; transform: translateX(-50%) translateY(8px); }
    8%, 22% { opacity: 1; transform: translateX(-50%) translateY(0); }
    25%, 100% { opacity: 0; }
  }
  @keyframes cap2 {
    0%, 25% { opacity: 0; transform: translateX(-50%) translateY(8px); }
    30%, 42% { opacity: 1; transform: translateX(-50%) translateY(0); }
    45%, 100% { opacity: 0; }
  }
  @keyframes cap3 {
    0%, 47% { opacity: 0; transform: translateX(-50%) translateY(8px); }
    52%, 65% { opacity: 1; transform: translateX(-50%) translateY(0); }
    68%, 100% { opacity: 0; }
  }
  @keyframes cap4 {
    0%, 70% { opacity: 0; transform: translateX(-50%) translateY(8px); }
    74%, 92% { opacity: 1; transform: translateX(-50%) translateY(0); }
    96%, 100% { opacity: 0; }
  }

  /* Beat indicator dots */
  .beat-dots {
    position: absolute;
    bottom: 38px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .beat-dot {
    width: 24px;
    height: 2px;
    background: var(--text-mute);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }
  .beat-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--purple-2);
    transform: translateX(-100%);
  }
  .beat-dot:nth-child(1)::after { animation: dotFill 14s infinite; animation-delay: 0s; }
  .beat-dot:nth-child(2)::after { animation: dotFill 14s infinite; animation-delay: 3.5s; }
  .beat-dot:nth-child(3)::after { animation: dotFill 14s infinite; animation-delay: 6.5s; }
  .beat-dot:nth-child(4)::after { animation: dotFill 14s infinite; animation-delay: 10s; }

  @keyframes dotFill {
    0% { transform: translateX(-100%); }
    25%, 100% { transform: translateX(0); }
  }

  /* Connection line decorative */
  .connector {
    stroke: var(--purple-2);
    stroke-width: 1;
    fill: none;
    opacity: 0.5;
    stroke-dasharray: 3 3;
  }
</style>
</head>
<body>

<div class="stage">

  <!-- Brand mark top-left -->
  <div class="brand-mark">
    <div class="brand-dot"></div>
    <div class="brand-text">appr<b>AI</b>seye</div>
  </div>

  <!-- Tagline bottom-right -->
  <div class="tagline">Bodhi · CGT Robot</div>

  <!-- Beat indicator dots -->
  <div class="beat-dots">
    <div class="beat-dot"></div>
    <div class="beat-dot"></div>
    <div class="beat-dot"></div>
    <div class="beat-dot"></div>
  </div>

  <!-- Caption (changes per beat) -->
  <div class="caption">
    <span class="caption-line caption-1">Self-contained. <em>Multi-layered.</em></span>
    <span class="caption-line caption-2">Adherent biology, <em>preserved.</em></span>
    <span class="caption-line caption-3">In-process QC, <em>per bottle.</em></span>
    <span class="caption-line caption-4">Individualized. <em>Programmable.</em></span>
  </div>

  <!-- Main scene -->
  <div class="scene">
    <svg class="bodhi-svg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">

      <!-- ============ DEFINITIONS ============ -->
      <defs>
        <!-- Steel cabinet gradients -->
        <linearGradient id="steelFront" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3A3F4A"/>
          <stop offset="0.5" stop-color="#7A8290"/>
          <stop offset="1" stop-color="#3A3F4A"/>
        </linearGradient>
        <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#4B5563"/>
        </linearGradient>
        <linearGradient id="glassGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1F2937" stop-opacity="0.4"/>
          <stop offset="0.5" stop-color="#374151" stop-opacity="0.2"/>
          <stop offset="1" stop-color="#1F2937" stop-opacity="0.4"/>
        </linearGradient>
        <linearGradient id="bottleGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E5E7EB" stop-opacity="0.85"/>
          <stop offset="0.5" stop-color="#F3F4F6" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#D1D5DB" stop-opacity="0.85"/>
        </linearGradient>
        <radialGradient id="bottleEnd" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#374151"/>
          <stop offset="1" stop-color="#111827"/>
        </radialGradient>

        <!-- Purple glow for screen -->
        <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.6">
          <stop offset="0" stop-color="#A855F7" stop-opacity="0.45"/>
          <stop offset="0.5" stop-color="#6D28D9" stop-opacity="0.25"/>
          <stop offset="1" stop-color="#0A0420" stop-opacity="0"/>
        </radialGradient>

        <!-- Cell zoom backdrop -->
        <radialGradient id="cellBackdrop" cx="0.5" cy="0.5" r="0.7">
          <stop offset="0" stop-color="#1a0d3a"/>
          <stop offset="1" stop-color="#07021a"/>
        </radialGradient>

        <!-- Soft amber halo for bottle 7 fault state -->
        <radialGradient id="faultHalo" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0"   stop-color="#F59E0B" stop-opacity="0.55"/>
          <stop offset="0.5" stop-color="#F59E0B" stop-opacity="0.25"/>
          <stop offset="1"   stop-color="#F59E0B" stop-opacity="0"/>
        </radialGradient>

        <!-- BOTTLE BODY (end-on view): opaque pinkish-white plastic+media combo.
             Sphere-style radial shading: bright upper-left (light from cabinet ceiling),
             darker lower-right. Reads as a CONTAINED 3D cylinder seen end-on, not a window. -->
        <radialGradient id="bottleBody" cx="0.32" cy="0.28" r="0.85">
          <stop offset="0"    stop-color="#FAEAEA"/>
          <stop offset="0.45" stop-color="#E8C8C8"/>
          <stop offset="0.85" stop-color="#B8888A"/>
          <stop offset="1"    stop-color="#7A4F52"/>
        </radialGradient>

        <!-- BOTTLE RIM: thin darker outline that defines the bottle's edge against the
             dark cabinet interior (the plastic wall thickness you see end-on). -->
        <radialGradient id="bottleRim" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.92" stop-color="#000" stop-opacity="0"/>
          <stop offset="0.97" stop-color="#3D2020" stop-opacity="0.7"/>
          <stop offset="1"    stop-color="#1A0A0A" stop-opacity="0.9"/>
        </radialGradient>

        <!-- DRIVE HEAD CENTER: the dark hub at the bottle's rotation axis (visible
             through the back of the bottle — the black-rubber drive-head). -->
        <radialGradient id="driveHead" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0"    stop-color="#1F1F1F"/>
          <stop offset="0.7"  stop-color="#0A0A0A"/>
          <stop offset="1"    stop-color="#000"/>
        </radialGradient>

        <!-- SETTLED MEDIA / CELL LAYER: a subtle deeper-pink crescent at the bottom
             of the bottle interior, suggesting the cell pellet that's settled by gravity. -->
        <radialGradient id="cellTint" cx="0.5" cy="0.85" r="0.45">
          <stop offset="0"    stop-color="#A03030" stop-opacity="0.45"/>
          <stop offset="0.7"  stop-color="#A03030" stop-opacity="0.15"/>
          <stop offset="1"    stop-color="#A03030" stop-opacity="0"/>
        </radialGradient>

        <!-- Specular glint on the upper rim (cabinet light catching the curved surface). -->
        <radialGradient id="bottleGlint" cx="0.32" cy="0.22" r="0.35">
          <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.7"/>
          <stop offset="0.6"  stop-color="#FFFFFF" stop-opacity="0.2"/>
          <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>

        <!-- Clip path: every porthole's interior. Used so the rotating cell crescent
             stays inside the circle (otherwise it sweeps out as it rotates). -->
        <clipPath id="portholeClip">
          <circle r="58"/>
        </clipPath>

        <!-- Same clip but for the larger Beat 4 portholes (radius 70). -->
        <clipPath id="portholeClipBig">
          <circle r="70"/>
        </clipPath>

        <!-- Cell crescent — the cell monolayer settled at the lowest point.
             Rendered larger now (radius ~50, sitting at the bottom of a -60..60 viewBox)
             so it actually reads through the small porthole. As the .crescent rotates,
             this arc sweeps around the inner wall of the bottle, simulating the
             rolling cell layer. -->
        <symbol id="cellCrescent" viewBox="-60 -60 120 120">
          <!-- Outer cell layer: thicker arc hugging the bottom inner wall -->
          <path d="M -50 18
                   A 53 53 0 0 0 50 18
                   Q 38 48 0 50
                   Q -38 48 -50 18 Z"
                fill="#E5A0A0" opacity="0.5"/>
          <!-- Denser inner pellet near the very bottom -->
          <path d="M -34 32
                   A 36 36 0 0 0 34 32
                   Q 24 50 0 51
                   Q -24 50 -34 32 Z"
                fill="#B91C1C" opacity="0.7"/>
        </symbol>

        <!-- Vision overlay grid -->
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(168, 85, 247, 0.18)" stroke-width="0.5"/>
        </pattern>

        <!-- Glow filters -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2"/>
        </filter>

        <!-- Mask: clip cell area to circle. r=200 leaves room for HUD chrome at the sides. -->
        <clipPath id="cellCircle">
          <circle cx="800" cy="450" r="200"/>
        </clipPath>

        <!-- Bottle reusable symbol.
             ViewBox is -100..100 wide, -30..30 tall (200×60).
             Surface "rolling" effect is achieved by a moving highlight stripe
             that slides vertically across the bottle interior (clip-path: stripe).
             The bottle itself never moves — only the surface texture moves,
             which is the correct 2D representation of rotisserie rotation. -->
        <symbol id="bottle" viewBox="-100 -30 200 60">
          <!-- bottle body (clear plastic, slight purple tint to suggest media) -->
          <rect x="-80" y="-22" width="160" height="44" rx="4" fill="url(#bottleGradient)" stroke="#E5E7EB" stroke-width="0.5" stroke-opacity="0.6"/>
          <!-- contents tint -->
          <rect x="-78" y="-20" width="156" height="40" rx="3" fill="rgba(168, 92, 246, 0.06)"/>

          <!-- Rolling-surface highlight stripes, clipped to bottle interior.
               Use a clipPath inline so they don't escape the bottle outline. -->
          <defs>
            <clipPath id="bottleInterior">
              <rect x="-78" y="-20" width="156" height="40" rx="3"/>
            </clipPath>
          </defs>
          <g clip-path="url(#bottleInterior)">
            <!-- Light stripe (specular) -->
            <rect class="roll-stripe-light" x="-78" y="-22" width="156" height="3"
                  fill="rgba(255,255,255,0.55)"/>
            <!-- Dark stripe (shadow side) -->
            <rect class="roll-stripe-dark"  x="-78" y="-22" width="156" height="3"
                  fill="rgba(0,0,0,0.35)"/>
          </g>

          <!-- Static specular line at top (always-on rim highlight) -->
          <rect x="-78" y="-21" width="156" height="1" fill="rgba(255,255,255,0.5)" opacity="0.7"/>
          <!-- Static shadow line at bottom (always-on rim shadow) -->
          <rect x="-78" y="20"  width="156" height="1" fill="rgba(0,0,0,0.35)"/>

          <!-- end caps (black rotational drive heads, like the mockup) -->
          <ellipse cx="-80" cy="0" rx="6" ry="22" fill="url(#bottleEnd)"/>
          <ellipse cx="80"  cy="0" rx="6" ry="22" fill="url(#bottleEnd)"/>
          <!-- inner cap detail -->
          <circle cx="-80" cy="0" r="4" fill="#0a0a0a"/>
          <circle cx="80"  cy="0" r="4" fill="#0a0a0a"/>
        </symbol>
      </defs>

      <!-- ============ BEAT 1 — WIDE SHOT ============ -->
      <g class="scene-wide">

        <!-- Cabinet (right side). 440 wide accommodates the round end-on portholes. -->
        <g transform="translate(900, 150)">
          <!-- Cabinet shadow -->
          <ellipse cx="220" cy="610" rx="240" ry="14" fill="black" opacity="0.4"/>

          <!-- Cabinet back panel -->
          <rect x="20" y="20" width="440" height="580" rx="6" fill="url(#steelFront)"/>
          <!-- Cabinet top -->
          <path d="M 20 20 L 460 20 L 470 10 L 30 10 Z" fill="url(#steelTop)"/>
          <!-- Glass door frame -->
          <rect x="40" y="40" width="400" height="540" rx="3" fill="#1F2937" stroke="#9CA3AF" stroke-width="2"/>
          <!-- Glass door -->
          <rect x="44" y="44" width="392" height="532" rx="2" fill="url(#glassGradient)"/>

<script>
  // Tick the live numbers during Beat 3 (vision overlay)
  // Beat 3 runs roughly 6.5s -> 10s in a 14s loop
  const confluenceEl = document.getElementById('confluence');
  const cellCountEl  = document.getElementById('cellCount');
  const frameEl      = document.getElementById('frameNum');

  const startTime = performance.now();
  function tick() {
    const elapsed = (performance.now() - startTime) / 1000;
    const t = elapsed % 14; // current loop position in seconds

    // Update only when in beat 3 (visible)
    if (t >= 6.5 && t <= 10) {
      const localT = (t - 6.5) / 3.5; // 0..1 within beat
      const conf   = (87 + localT * 4).toFixed(1);
      const cells  = (2.84 + localT * 0.18).toFixed(2);
      confluenceEl.textContent = conf + '%';
      cellCountEl.textContent  = cells + 'e6';

      // Tick the timestamp (HH:MM:SS)
      const baseSec = 14 * 3600 + 32 * 60 + 8;
      const sec     = baseSec + Math.floor(elapsed);
      const hh      = String(Math.floor(sec / 3600) % 24).padStart(2, '0');
      const mm      = String(Math.floor(sec / 60) % 60).padStart(2, '0');
      const ss      = String(sec % 60).padStart(2, '0');
      frameEl.textContent = `${hh}:${mm}:${ss}`;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
